plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id 'com.google.gms.google-services'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    namespace "lk.topjobs.app"
    compileSdk = 36 // Explicit version
    ndkVersion = "27.0.12077973"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    // defaultConfig {
    //     applicationId "lk.topjobs.app"
    //     minSdkVersion flutter.minSdkVersion
    //     targetSdkVersion flutter.targetSdkVersion
    //     versionCode flutterVersionCode.toInteger()
    //     versionName flutterVersionName
    // }
    defaultConfig {
        applicationId "lk.topjobs.app"
        minSdkVersion flutter.minSdkVersion  // Explicit version
        targetSdkVersion 35  // Updated to API level 35
        versionCode 40
        versionName "40.0"
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            // Enable code shrinking and obfuscation with ProGuard rules
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    
    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:34.3.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'androidx.work:work-runtime-ktx:2.9.0'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}

// Suppress Java 8 obsolete warnings from third-party plugins
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << "-Xlint:-options"
    options.compilerArgs << "-Xlint:-deprecation"
    options.compilerArgs << "-Xlint:-unchecked"
}

// Ensure all subprojects use Java 17
subprojects {
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            project.android {
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }
                
                // Only apply kotlinOptions for application projects
                if (project.plugins.hasPlugin('com.android.application')) {
                    kotlinOptions {
                        jvmTarget = '17'
                    }
                }
            }
        }
        
        tasks.withType(JavaCompile).configureEach {
            options.compilerArgs << "-Xlint:-options"
            options.compilerArgs << "-Xlint:-deprecation"
            options.compilerArgs << "-Xlint:-unchecked"
        }
    }
}
